name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - run: go build ./...
      - run: go test ./... -race

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - run: make cross-compile

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - run: go test ./internal/engine/ -tags=integration -race

  windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - run: go build ./...
      - run: go test ./... -race

  windows-smoke:
    name: Smoke (windows CLI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - name: Build
        run: go build -ldflags "-s -w -X github.com/zyrophix/lethe/internal/cli.version=smoke" -o lethe.exe ./cmd/lethe
      - name: List modules
        run: ./lethe.exe list
      - name: Dry-run clean (safe)
        run: ./lethe.exe clean --dry-run --max-risk safe

  e2e-docker:
    name: E2E (Docker root modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - run: make e2e

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m
