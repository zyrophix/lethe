version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - "(*os.File).Close"
        - "(*tar.Writer).Close"
        - "(*tar.Reader).Close"

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
