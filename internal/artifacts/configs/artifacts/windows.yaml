- module: events
  risk: risky
  artifacts: []

- module: history
  risk: risky
  artifacts:
    - path: "{{.AppData}}/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt"
      method: truncate
      risk: safe
      description: "PowerShell history"
    - path: "{{.AppData}}/Microsoft/Windows/Recent/*.lnk"
      method: delete
      risk: safe
      description: "Recent file shortcuts"
    - path: "{{.AppData}}/Microsoft/Windows/Recent/AutomaticDestinations/*"
      method: delete
      risk: risky
      description: "Automatic jump lists"
    - path: "{{.AppData}}/Microsoft/Windows/Recent/CustomDestinations/*"
      method: delete
      risk: risky
      description: "Custom jump lists"
    - path: "{{.LocalAppData}}/ConnectedDevicesPlatform/*"
      method: delete
      risk: risky
      recursive: true
      description: "Windows Timeline/Activity History"
    - path: "{{.LocalAppData}}/Microsoft/Windows/History/*"
      method: delete
      risk: safe
      recursive: true
      description: "IE/Edge browsing history"
    - path: "{{.AppData}}/Code/User/settings.json"
      method: delete
      risk: safe
      description: "VS Code user settings"
    - path: "{{.AppData}}/Code/User/History/*"
      method: delete
      risk: safe
      recursive: true
      description: "VS Code file edit history"
    - path: "{{.AppData}}/Code/logs/*"
      method: delete
      risk: safe
      recursive: true
      description: "VS Code logs"
    - path: "{{.LocalAppData}}/JetBrains/*"
      method: delete
      risk: safe
      recursive: true
      description: "JetBrains IDE data"
    - path: "{{.AppData}}/JetBrains/*"
      method: delete
      risk: safe
      recursive: true
      description: "JetBrains IDE config"
    - path: "{{.UserProfile}}/.vagrant.d/data/*"
      method: delete
      risk: risky
      recursive: true
      description: "Vagrant machine data"
    - path: "{{.UserProfile}}/.vagrant.d/tmp/*"
      method: delete
      risk: risky
      recursive: true
      description: "Vagrant temp files"
    - path: "{{.LocalAppData}}/Microsoft/Terminal Server Client/Cache/*"
      method: delete
      risk: safe
      recursive: true
      description: "RDP bitmap cache"

- module: registry
  risk: destructive
  artifacts:
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ComDlg32\\OpenSavePidlMRU"
      method: wipe_registry
      risk: risky
      description: "Open/Save dialog MRU"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RecentDocs"
      method: wipe_registry
      risk: risky
      description: "Recent documents"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\TypedPaths"
      method: wipe_registry
      risk: risky
      description: "Explorer typed paths"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\UserAssist"
      method: wipe_registry
      risk: risky
      description: "UserAssist (program execution tracking)"
    - path: "HKCU:\\Software\\Microsoft\\Terminal Server Client\\Default"
      method: wipe_registry
      risk: risky
      description: "RDP connection history"
    - path: "HKCU:\\Software\\Microsoft\\Terminal Server Client\\Servers"
      method: wipe_registry
      risk: risky
      description: "RDP server history"
    - path: "HKLM:\\SYSTEM\\CurrentControlSet\\Enum\\USBSTOR"
      method: wipe_registry
      risk: destructive
      backup: true
      description: "USB storage device history (DESTRUCTIVE)"
    - path: "HKLM:\\SYSTEM\\MountedDevices"
      method: wipe_registry
      risk: destructive
      backup: true
      description: "Mounted device history (DESTRUCTIVE)"
    - path: "HKLM:\\SYSTEM\\CurrentControlSet\\Services\\bam\\State\\UserSettings"
      method: wipe_registry
      risk: destructive
      backup: true
      description: "Background Activity Monitor (DESTRUCTIVE)"
    - path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCompatCache"
      method: wipe_registry
      risk: destructive
      backup: true
      description: "ShimCache/AppCompat (DESTRUCTIVE)"
    - path: "HKCU:\\Software\\Classes\\Local Settings\\Software\\Microsoft\\Windows\\Shell\\BagMRU"
      method: wipe_registry
      risk: risky
      description: "Shellbags BagMRU"
    - path: "HKCU:\\Software\\Classes\\Local Settings\\Software\\Microsoft\\Windows\\Shell\\Bags"
      method: wipe_registry
      risk: risky
      description: "Shellbags Bags"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\Shell\\BagMRU"
      method: wipe_registry
      risk: risky
      description: "Shell BagMRU (legacy)"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\Shell\\Bags"
      method: wipe_registry
      risk: risky
      description: "Shell Bags (legacy)"
    - path: "HKCU:\\Software\\Classes\\Local Settings\\Software\\Microsoft\\Windows\\Shell\\MuiCache"
      method: wipe_registry
      risk: risky
      description: "MUICache (program execution via Explorer)"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU"
      method: wipe_registry
      risk: risky
      description: "Run dialog history (Win+R)"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\WordWheelQuery"
      method: wipe_registry
      risk: risky
      description: "Explorer search history (WordWheelQuery)"
    - path: "HKCU:\\Software\\Microsoft\\Internet Explorer\\TypedURLs"
      method: wipe_registry
      risk: safe
      description: "IE typed URLs"
    - path: "HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\ComDlg32\\LastVisitedPidlMRU"
      method: wipe_registry
      risk: risky
      description: "Last visited dialog MRU"

- module: filesystem
  risk: risky
  artifacts:
    - path: "{{.UserProfile}}/AppData/Local/Microsoft/Windows/Explorer/thumbcache_*.db"
      method: delete
      risk: safe
      description: "Thumbnail cache"
    - path: "{{.SystemRoot}}/System32/sru/SRUDB.dat"
      method: delete
      risk: risky
      description: "SRUM database"
    - path: "{{.LocalAppData}}/Microsoft/Windows/Notifications/*"
      method: delete
      risk: risky
      description: "Notification history"
    - path: "{{.UserProfile}}/Thumbs.db"
      method: delete
      risk: safe
      description: "Legacy thumbnail cache"
    - path: "{{.SystemDrive}}/$Recycle.Bin/*"
      method: delete
      risk: safe
      recursive: true
      description: "Recycle Bin contents"
    - path: "C:/ProgramData/Microsoft/Search/Data/Applications/Windows/Windows.edb"
      method: delete
      risk: risky
      locking_procs: ["SearchIndexer.exe"]
      description: "Windows Search database (Windows.edb)"
    - path: "{{.SystemDrive}}/hiberfil.sys"
      method: delete
      risk: risky
      description: "Hibernation file"
    - path: "C:/Windows/System32/LogFiles/WMI/RtBackup/*"
      method: delete
      risk: risky
      recursive: true
      description: "ETW RTBackup traces"
    - path: "C:/ProgramData/Microsoft/Diagnosis/ETLLogs/*"
      method: delete
      risk: risky
      recursive: true
      description: "Windows Diagnostic ETL logs"

- module: temp
  risk: risky
  artifacts:
    - path: "{{.Temp}}/*"
      method: delete
      risk: safe
      recursive: true
      description: "User temp files"
    - path: "{{.SystemRoot}}/Temp/*"
      method: delete
      risk: safe
      recursive: true
      description: "System temp files"
    - path: "C:/ProgramData/Microsoft/Windows/WER/ReportArchive/*"
      method: delete
      risk: safe
      recursive: true
      description: "Windows Error Reporting archive"
    - path: "C:/Windows/Minidump/*"
      method: delete
      risk: safe
      description: "Minidump files"
    - path: "C:/Windows/MEMORY.DMP"
      method: delete
      risk: risky
      description: "Full memory dump"
    - path: "C:/ProgramData/Microsoft/Windows Defender/Scans/History/*"
      method: delete
      risk: risky
      recursive: true
      description: "Defender scan history"
    - path: "{{.LocalAppData}}/Microsoft/Windows/INetCache/*"
      method: delete
      risk: safe
      recursive: true
      description: "IE/Edge cache"
    - path: "{{.LocalAppData}}/Microsoft/OneDrive/logs/*"
      method: delete
      risk: safe
      description: "OneDrive logs"
    - path: "{{.AppData}}/Microsoft/Teams/logs.txt"
      method: truncate
      risk: safe
      description: "Teams logs"
    - path: "C:/Windows/System32/LogFiles/HTTPERR/*"
      method: delete
      risk: safe
      description: "HTTP.sys error logs"
    - path: "C:/Windows/Logs/CBS/*"
      method: delete
      risk: safe
      recursive: true
      description: "Component-Based Servicing logs"
    - path: "C:/Windows/Logs/DISM/*"
      method: delete
      risk: safe
      recursive: true
      description: "DISM logs"
    - path: "C:/Windows/Logs/WindowsUpdate/*"
      method: delete
      risk: safe
      recursive: true
      description: "Windows Update logs"
    - path: "C:/ProgramData/USOShared/Logs/*"
      method: delete
      risk: safe
      recursive: true
      description: "Update Session Orchestrator logs"
    - path: "C:/ProgramData/Microsoft/Windows/WER/Temp/*"
      method: delete
      risk: safe
      recursive: true
      description: "Windows Error Reporting temp queue"

- module: security
  risk: destructive
  artifacts:
    - path: "C:/ProgramData/CrowdStrike/Logs/*"
      method: delete
      risk: risky
      description: "CrowdStrike Falcon logs"
    - path: "C:/ProgramData/Sentinel/Logs/*"
      method: delete
      risk: risky
      description: "SentinelOne logs"
    - path: "C:/ProgramData/CarbonBlack/Logs/*"
      method: delete
      risk: risky
      description: "Carbon Black logs"
    - path: "C:/ProgramData/McAfee/Endpoint Security/Logs/*"
      method: delete
      risk: risky
      recursive: true
      description: "McAfee logs"
    - path: "C:/ProgramData/Symantec/Symantec Endpoint Protection/CurrentVersion/Data/Logs/*"
      method: delete
      risk: risky
      recursive: true
      description: "Symantec logs"
    - path: "C:/Windows/System32/LogFiles/Firewall/*.log"
      method: delete
      risk: risky
      description: "Windows Firewall logs"
    - path: "C:/Windows/System32/wbem/Logs/*.log"
      method: delete
      risk: safe
      description: "WMI activity logs"
    - path: "C:/ProgramData/Microsoft/Windows Defender Advanced Threat Protection/Cache/*"
      method: delete
      risk: risky
      recursive: true
      description: "Defender ATP cache"
    - path: "C:/ProgramData/Microsoft/Microsoft Defender/Support/*"
      method: delete
      risk: risky
      recursive: true
      description: "Defender MPLog support logs"
    - path: "C:/inetpub/logs/LogFiles/*"
      method: delete
      risk: risky
      recursive: true
      description: "IIS web server logs"

- module: advanced
  risk: destructive
  artifacts:
    - path: "{{.UserProfile}}/AppData/Local/Microsoft/Windows/Explorer/*.db"
      method: delete
      risk: safe
      description: "Explorer thumbnail and search databases"
    - path: "C:/Windows/Prefetch/*.pf"
      method: delete
      risk: risky
      description: "Prefetch files"
    - path: "C:/Windows/AppCompat/Programs/RecentFileCache.bcf"
      method: delete
      risk: risky
      description: "RecentFileCache"
    - path: "C:/Windows/AppCompat/Programs/Amcache.hve*"
      method: delete
      risk: destructive
      backup: true
      locking_procs: ["AeLookupSvc.exe"]
      description: "Amcache (DESTRUCTIVE: application execution history)"
    - path: "C:/Windows/INF/setupapi.dev.log"
      method: delete
      risk: risky
      description: "Device install history log (setupapi)"
    - path: "C:/Windows/LiveKernelReports/*"
      method: delete
      risk: risky
      recursive: true
      description: "Live kernel reports"

- module: journal
  risk: destructive
  artifacts: []

- module: pagefile
  risk: destructive
  artifacts: []

- module: shadows
  risk: destructive
  artifacts: []
