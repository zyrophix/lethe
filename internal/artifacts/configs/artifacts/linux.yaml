- module: network
  risk: risky
  artifacts:
    - path: "/etc/NetworkManager/system-connections/*"
      method: delete
      risk: risky
      backup: true
      description: "NetworkManager connection profiles"
    - path: "/var/lib/dhclient/*.leases"
      method: delete
      risk: risky
      description: "DHCP leases (dhclient)"
    - path: "/var/lib/dhcp/*.leases"
      method: delete
      risk: risky
      description: "DHCP leases (dhcpd)"
    - path: "/var/lib/mysql/mysql-bin.*"
      method: delete
      risk: destructive
      backup: true
      locking_procs: ["mysqld"]
      exclude: ["mysql-bin.index"]
      description: "MySQL binary replication logs (DESTRUCTIVE: breaks replication)"
    - path: "/var/lib/mysql/ib_logfile*"
      method: delete
      risk: destructive
      backup: true
      locking_procs: ["mysqld"]
      description: "MySQL InnoDB redo logs (DESTRUCTIVE: can corrupt DB)"
    - path: "/etc/openvpn/client/*.conf"
      method: delete
      risk: risky
      backup: true
      description: "OpenVPN client configs"
    - path: "/etc/wireguard/*.conf"
      method: delete
      risk: risky
      backup: true
      description: "WireGuard configs"
    - path: "/var/spool/postfix/deferred/*"
      method: delete
      risk: risky
      recursive: true
      description: "Postfix deferred mail"
    - path: "/etc/iptables/rules.v4"
      method: delete
      risk: destructive
      backup: true
      description: "iptables persistent rules (DESTRUCTIVE)"

